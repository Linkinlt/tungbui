<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng Kèo</title>
<style>
/* Viết CSS kiểu cũ để WebView đời cũ (máy chiếu) vẫn hiển thị đúng: không dùng clamp, inset, flex gap */
:root{
  --bg:#0d1612; --panel:#15231c; --row:#18291f; --line:#2a4236;
  --fg:#f1f5f2; --muted:#a9bdb2; --accent:#7fd99a; --focus:#ffd23f; --up:#7fd99a; --down:#ff7a6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0d1612;background:var(--bg);color:#f1f5f2;color:var(--fg);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:24px;overflow:hidden}
@media (max-width:1100px){body{font-size:20px}}
@media (max-width:700px){body{font-size:16px}}
.app{display:flex;flex-direction:column;height:100%;padding:18px 28px}
.app > *{margin-bottom:12px}
.app > *:last-child{margin-bottom:0}
header{display:flex;align-items:center;flex-wrap:wrap}
header > *{margin-right:18px}
header > *:last-child{margin-right:0}
h1{margin:0;font-size:1.5em;font-weight:900;white-space:nowrap}
h1 span{color:var(--accent)}
.status{color:var(--muted);font-size:.75em;flex:1;min-width:0}
.clock{font-size:1.6em;font-weight:700}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:4px 4px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;margin:0 8px 4px 0;font-size:.72em;padding:8px 14px}
button{font:inherit;font-size:.85em;font-weight:700;padding:10px 18px;border-radius:10px;border:3px solid var(--line);background:var(--panel);color:var(--fg);outline:none}
button.on{background:var(--accent);color:#0d1612;border-color:var(--accent)}
button:focus,.row:focus,.empty:focus{border-color:var(--focus)!important;box-shadow:0 0 0 4px rgba(255,210,63,.3)}
.tablewrap{flex:1;overflow-y:auto;border:2px solid var(--line);border-radius:12px;min-height:0}
.head,.row{display:grid;grid-template-columns:5.6em minmax(0,1fr) 4.4em 4.4em 4.4em 4.8em 4.8em;align-items:center;grid-column-gap:8px;padding:6px 16px}
.head{position:-webkit-sticky;position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:.72em;text-transform:uppercase;letter-spacing:.06em;z-index:2;border-bottom:2px solid var(--line)}
.head div:nth-child(n+3),.row .o{text-align:center}
.row{border:3px solid transparent;border-bottom:1px solid var(--line);outline:none}
.time{font-weight:700;line-height:1.15}
.time small{display:block;color:var(--muted);font-weight:400;font-size:.68em;white-space:nowrap}
.time.live{color:var(--down)}
.time.live small{color:var(--down)}
.teams{min-width:0;line-height:1.18}
.teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams div.win{font-weight:800}
.teams div.lg{color:var(--accent);font-size:.62em;font-weight:600;letter-spacing:.02em}
.ver{float:right;margin-right:0!important;opacity:.7}
.o{font-size:1.15em;font-weight:800}
.o.fav{color:var(--focus)}
.o .a{font-size:.6em;margin-left:2px}
.o .a.up{color:var(--up)} .o .a.down{color:var(--down)}
.o.na{color:var(--line)}
.lineinfo{grid-column:2 / 8;color:var(--muted);font-size:.65em}
.day{padding:5px 16px;background:var(--bg);color:var(--accent);font-weight:700;font-size:.8em;border-bottom:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted);border:3px solid transparent;outline:none;line-height:1.6}
.legend{color:var(--muted);font-size:.66em}
.legend span{display:inline-block;margin-right:24px}
.legend b{color:var(--fg)}
[hidden]{display:none!important}
.ou{display:none}
.ask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9}
.askbox{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:28px 32px;text-align:center;width:90%;max-width:560px}
.askbox h2{margin:0 0 20px;font-size:1.3em}
.askbox button{margin:0 8px;font-size:1em;padding:12px 28px}
.tablewrap{-webkit-overflow-scrolling:touch}
@media (max-width:700px){
  .app{padding:10px 10px}
  h1{font-size:1.3em}
  .clock{font-size:1.3em}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .tabs button{flex:0 0 auto;font-size:.85em}
  .head,.row{grid-template-columns:3.9em minmax(0,1fr) 3.2em 3.2em 3.2em;grid-column-gap:4px;padding:8px 8px}
  .head div:nth-child(n+6),.row .t{display:none}
  .o{font-size:1.05em}
  .ou{display:block;grid-column:2 / 6;color:var(--muted);font-size:.78em;margin-top:2px}
  .ou b{color:var(--fg)}
  .lineinfo{display:none}
  .legend span{display:block;margin:0 0 2px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Bảng <span>Kèo</span></h1>
    <div class="status" id="status">Đang mở…</div>
    <div class="clock" id="clock"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="tablewrap" id="wrap">
    <div class="head"><div>Giờ</div><div>Trận</div><div>1</div><div>X</div><div>2</div><div>Tài</div><div>Xỉu</div></div>
    <div id="rows"></div>
  </div>
  <div class="legend">
    <span><b>1</b> chủ nhà thắng · <b>X</b> hoà · <b>2</b> khách thắng</span>
    <span>Số <b style="color:#ffd23f">vàng</b> là đội được đánh giá mạnh hơn</span>
    <span><b style="color:#7fd99a">▲</b><b style="color:#ff7a6b">▼</b> tăng/giảm so với lúc mở kèo</span>
    <span>Tài/Xỉu mốc 2.5 bàn nếu không ghi khác · "–" là nhà cái chưa mở tỷ lệ</span>
    <span class="ver" id="ver"></span>
  </div>
</div>

<div class="ask" id="ask" hidden>
  <div class="askbox">
    <h2>Thoát app?</h2>
    <button id="stay">Ở lại</button><button id="quit">Thoát</button>
  </div>
</div>

<script>
/* Hiện lỗi lên màn hình thay vì đứng im */
window.onerror = function(msg, src, line){
  var s = document.getElementById("status");
  if(s) s.textContent = "Lỗi app: " + msg + " (dòng " + line + ")";
};
</script>
<script>
// [mã ESPN, tên đầy đủ, tên ngắn hiện trong bảng chung]
const LEAGUES = [
  ["eng.1","Ngoại hạng Anh","Anh"],
  ["esp.1","La Liga","TBN"],
  ["ita.1","Serie A","Ý"],
  ["ger.1","Bundesliga","Đức"],
  ["fra.1","Ligue 1","Pháp"],
  ["uefa.champions","Cúp C1","C1"],
  ["uefa.europa","Cúp C2","C2"],
  ["uefa.europa.conf","Cúp C3","C3"],
  ["eng.2","Hạng nhất Anh","Anh 2"],
  ["ned.1","Hà Lan","Hà Lan"],
  ["por.1","Bồ Đào Nha","BĐN"],
  ["tur.1","Thổ Nhĩ Kỳ","Thổ"],
  ["sco.1","Scotland","Scot"],
  ["bel.1","Bỉ","Bỉ"],
  ["kor.1","Hàn Quốc","Hàn"],
  ["jpn.1","Nhật Bản","Nhật"],
  ["chn.1","Trung Quốc","Trung"],
  ["aus.1","Úc","Úc"],
  ["ksa.1","Ả Rập Xê Út","Ả Rập"],
  ["usa.1","Mỹ MLS","Mỹ"],
  ["mex.1","Mexico","Mexico"],
  ["bra.1","Brazil","Brazil"],
  ["arg.1","Argentina","Arg"],
];
const ALL = "all";
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const findLeague = k => { for(const l of LEAGUES) if(l[0]===k) return l; return null; };
let bad = ls.get("bad2", {});            // giải ESPN không có -> ẩn tab
let league = ls.get("tab", ALL);
if(league!==ALL && (!findLeague(league) || bad[league])) league = ALL;
const pad2 = n => (n<10?"0":"")+n;
const hhmm = d => pad2(d.getHours())+":"+pad2(d.getMinutes());
function ymd(d){ return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }

/* ---------- gọi mạng qua Android ---------- */
const cbs = {}; let cbn = 0;
window.__cb = (id, json) => { const f = cbs[id]; delete cbs[id]; if(f) f(JSON.parse(json)); };
function httpGet(url){
  return new Promise(res => {
    if(window.Android){ const id = "c"+(++cbn); cbs[id] = res; window.Android.get(url, id); }
    else {
      const x = new XMLHttpRequest();
      x.open("GET", url); x.timeout = 20000;
      x.onload = () => res({status:x.status, body:x.responseText});
      x.onerror = x.ontimeout = () => res({status:0, body:""});
      x.send();
    }
  });
}

/* ---------- đọc dữ liệu ESPN ---------- */
function am2dec(v){
  if(v==null || v==="") return null;
  if(v==="EVEN" || v==="EV") return 2;
  const n = parseFloat(String(v).replace("+",""));
  if(!isFinite(n) || n===0) return null;
  return n > 0 ? 1 + n/100 : 1 + 100/Math.abs(n);
}
function pick(){ for(let i=0;i<arguments.length;i++){ const v = arguments[i]; if(v!=null && v!=="") return v; } return null; }
const g = (o, path) => { let x = o; for(const k of path){ if(x==null) return null; x = x[k]; } return x; };
function espnEvent(ev, lg){
  const c = (ev.competitions||[])[0] || {};
  let home = {}, away = {};
  for(const t of c.competitors||[]){ if(t.homeAway==="home") home = t; else away = t; }
  let od = {};
  for(const o of c.odds||[]){ if(o){ od = o; break; } }
  const ml = od.moneyline || {}, tot = od.total || {};
  const st = g(ev,["status","type"]) || {};
  const o = [
    am2dec(pick(g(od,["homeTeamOdds","moneyLine"]), g(ml,["home","close","odds"]), g(ml,["home","open","odds"]))),
    am2dec(pick(g(od,["drawOdds","moneyLine"]), g(ml,["draw","close","odds"]), g(ml,["draw","open","odds"]))),
    am2dec(pick(g(od,["awayTeamOdds","moneyLine"]), g(ml,["away","close","odds"]), g(ml,["away","open","odds"]))),
    am2dec(pick(od.overOdds, g(tot,["over","close","odds"]), g(tot,["over","open","odds"]))),
    am2dec(pick(od.underOdds, g(tot,["under","close","odds"]), g(tot,["under","open","odds"]))),
  ];
  const open = [
    am2dec(g(ml,["home","open","odds"])), am2dec(g(ml,["draw","open","odds"])), am2dec(g(ml,["away","open","odds"])),
    am2dec(g(tot,["over","open","odds"])), am2dec(g(tot,["under","open","odds"])),
  ];
  let line = od.overUnder;
  if(line==null){ const s = g(tot,["over","close","line"]); if(s) line = parseFloat(String(s).replace(/[a-z]/ig,"")); }
  const VI = {"FT":"Hết","HT":"Nghỉ giữa giờ","Postponed":"Hoãn","Canceled":"Huỷ","AET":"Hết hiệp phụ","FT-Pens":"Hết luân lưu"};
  return {id:ev.id, t:ev.date, lg:lg, home:g(home,["team","displayName"])||"?", away:g(away,["team","displayName"])||"?",
          o:o, open:open, line:line, state:st.state||"pre", detail:VI[st.shortDetail]||st.shortDetail||"",
          hs: home.score, as: away.score};
}

/* ---------- tải một giải ---------- */
const BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
const data = {};          // slug -> {list, at}
async function loadLeague(slug, extraDays){
  const reqs = [httpGet(BASE + slug + "/scoreboard")];
  for(let k=1;k<=extraDays;k++) reqs.push(httpGet(BASE + slug + "/scoreboard?dates=" + ymd(new Date(Date.now()+k*86400e3))));
  const rs = await Promise.all(reqs);
  if(rs[0].status===400 || rs[0].status===404){ bad[slug] = 1; ls.set("bad2", bad); return {status:rs[0].status}; }
  if(!rs.some(r => r.status===200)) return {status:rs[0].status};
  const seen = {}, list = [];
  for(const r of rs){
    if(r.status!==200) continue;
    try{ for(const ev of JSON.parse(r.body).events||[]){ if(!seen[ev.id]){ seen[ev.id] = 1; list.push(espnEvent(ev, slug)); } } }catch(e){}
  }
  data[slug] = {list:list, at:Date.now()};
  return {status:200};
}
async function pool(items, n, fn){
  let i = 0;
  async function worker(){ while(i < items.length){ const it = items[i++]; await fn(it); } }
  const ws = []; for(let k=0;k<n;k++) ws.push(worker());
  await Promise.all(ws);
}

let busy = false, lastAll = 0;
async function refresh(){
  if(busy) return; busy = true;
  try{
    if(league===ALL){
      const slugs = LEAGUES.filter(l => !bad[l[0]]).map(l => l[0]);
      $("status").textContent = "Đang tải tất cả các giải…";
      let ok = 0, fail = 0, lastErr = 0;
      await pool(slugs, 6, async slug => { const r = await loadLeague(slug, 0); if(r.status===200) ok++; else { fail++; lastErr = r.status; } });
      drawTabs();
      if(ok){ lastAll = Date.now(); show(); $("status").textContent = "Tất cả giải · ESPN · cập nhật " + hhmm(new Date()); }
      else $("status").textContent = "Không tải được: " + (lastErr===0 ? "không có mạng hoặc không kết nối được ESPN." : "ESPN báo lỗi " + lastErr + ".");
    } else {
      const L = findLeague(league);
      $("status").textContent = "Đang tải " + L[1] + "…";
      const r = await loadLeague(league, 3);
      if(r.status===200){ show(); $("status").textContent = L[1] + " · ESPN · cập nhật " + hhmm(new Date()); }
      else {
        if(bad[league]){ league = ALL; ls.set("tab", ALL); drawTabs(); busy = false; return refresh(); }
        $("status").textContent = "Không tải được: " + (r.status===0 ? "không có mạng hoặc không kết nối được ESPN." : "ESPN báo lỗi " + r.status + ".") + (data[league] ? " Đang hiện dữ liệu lần trước." : "");
      }
    }
  } finally { busy = false; }
}

/* ---------- vẽ bảng ---------- */
function show(){
  let list = [];
  if(league===ALL){
    const from = Date.now() - 3*3600e3, to = Date.now() + 3*86400e3;
    for(const slug in data){
      if(bad[slug]) continue;
      for(const m of data[slug].list){
        const t = new Date(m.t).getTime();
        if(m.state==="in" || (t >= from && t <= to)) list.push(m);
      }
    }
  } else if(data[league]) list = data[league].list.slice();
  render(list);
  if(!busy){
    const L = findLeague(league), at = league===ALL ? lastAll : (data[league] ? data[league].at : 0);
    if(at) $("status").textContent = (league===ALL ? "Tất cả giải" : L[1]) + " · ESPN · cập nhật " + hhmm(new Date(at));
  }
}
const fmt = v => v==null ? "–" : v.toFixed(2);
function arrow(now, before){
  if(now==null || before==null) return "";
  const d = now - before;
  if(Math.abs(d) < 0.02) return "";
  return d > 0 ? '<span class="a up">▲</span>' : '<span class="a down">▼</span>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }
function render(list){
  list.sort((a,b) => (new Date(a.t) - new Date(b.t)) || (a.lg < b.lg ? -1 : a.lg > b.lg ? 1 : 0));
  if(!list.length){ $("rows").innerHTML = '<div class="empty" tabindex="0">' + (league===ALL ? "Trong 3 ngày tới chưa có trận nào." : "Giải này mấy ngày tới chưa có trận nào.") + '</div>'; return; }
  const days = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
  let html = "", lastDay = "";
  for(const m of list){
    const d = new Date(m.t), dayKey = d.toDateString();
    if(dayKey !== lastDay){ lastDay = dayKey; html += '<div class="day">' + days[d.getDay()] + ", " + d.getDate() + "/" + (d.getMonth()+1) + '</div>'; }
    const live = m.state==="in";
    const score = (m.state!=="pre" && m.hs!=null) ? m.hs + " - " + m.as : "";
    const sub = live ? (score + " · " + esc(m.detail)) : m.state==="post" ? ("Hết · " + score) : esc(m.detail==="Scheduled" || /^\d/.test(m.detail) || /[AP]M/.test(m.detail) ? "" : m.detail);
    const fav = Math.min(m.o[0]==null?99:m.o[0], m.o[2]==null?99:m.o[2]);
    const p = m.open || [];
    let cells = "";
    for(let i=0;i<5;i++){
      const v = m.o[i];
      cells += '<div class="o' + (i>2?" t":"") + (v==null?" na":"") + (i!==1 && i<3 && v===fav ? " fav":"") + '">' + fmt(v) + arrow(v, p[i]) + '</div>';
    }
    const hw = m.state==="post" && +m.hs > +m.as, aw = m.state==="post" && +m.as > +m.hs;
    const L = findLeague(m.lg);
    html += '<div class="row" tabindex="0">' +
      '<div class="time' + (live?" live":"") + '">' + hhmm(d) + '<small>' + sub + '</small></div>' +
      '<div class="teams">' + (league===ALL && L ? '<div class="lg">' + esc(L[1]) + '</div>' : '') +
        '<div class="' + (m.state==="pre"||hw?"win":"") + '">' + esc(m.home) + '</div><div class="' + (aw?"win":"") + '">' + esc(m.away) + '</div></div>' +
      cells +
      (m.o[3]!=null || m.o[4]!=null ? '<div class="ou">Tài ' + (m.line!=null?m.line:2.5) + ': <b>' + fmt(m.o[3]) + '</b> · Xỉu: <b>' + fmt(m.o[4]) + '</b></div>' : '') +
      (m.line!=null && m.line!==2.5 && m.o[3]!=null ? '<div class="lineinfo">Mốc Tài/Xỉu: ' + m.line + ' bàn</div>' : "") +
      '</div>';
  }
  $("rows").innerHTML = html;
}

/* ---------- tab giải ---------- */
function drawTabs(){
  let h = '<button data-k="' + ALL + '" class="' + (league===ALL?"on":"") + '">Tất cả</button>';
  for(const l of LEAGUES) if(!bad[l[0]]) h += '<button data-k="' + l[0] + '" class="' + (l[0]===league?"on":"") + '">' + l[1] + '</button>';
  const had = document.activeElement && document.activeElement.parentNode === $("tabs") ? document.activeElement.getAttribute("data-k") : null;
  $("tabs").innerHTML = h;
  if(had){ const b = $("tabs").querySelector('[data-k="' + had + '"]'); if(b) b.focus(); }
}
$("tabs").addEventListener("click", e => {
  let b = e.target; while(b && b.tagName!=="BUTTON") b = b.parentNode;
  if(!b || !b.getAttribute("data-k")) return;
  league = b.getAttribute("data-k"); ls.set("tab", league); drawTabs();
  const nb = $("tabs").querySelector('[data-k="' + league + '"]'); if(nb) nb.focus();
  show();
  const fresh = league===ALL ? false : (data[league] && Date.now() - data[league].at < 120e3);
  if(!fresh) refresh();
});
/* Nút Quay lại: lần 1 về đầu bảng, lần 2 hỏi thoát */
function focusTab(){ const b = $("tabs").querySelector(".on") || $("tabs").querySelector("button"); if(b) b.focus(); }
function closeAsk(){ $("ask").hidden = true; focusTab(); }
$("stay").onclick = closeAsk;
$("quit").onclick = () => { if(window.Android && window.Android.exit) window.Android.exit(); else closeAsk(); };
window.onBack = () => {
  if(!$("ask").hidden){ closeAsk(); return true; }
  const cur = document.activeElement;
  const onTabs = cur && cur.parentNode === $("tabs");
  if(!onTabs || $("wrap").scrollTop > 0){ $("wrap").scrollTop = 0; focusTab(); return true; }
  $("ask").hidden = false; $("stay").focus(); return true;
};
const cm = navigator.userAgent.match(/Chrome\/([\d.]+)/);
$("ver").textContent = "Bản " + (window.Android && window.Android.version ? window.Android.version() : "web") + " · WebView " + (cm ? cm[1].split(".")[0] : "?");

/* ---------- điều khiển bằng remote ---------- */
function focusables(){
  const scope = $("ask").hidden ? document : $("ask");
  const all = scope.querySelectorAll("button, .row, .empty"), out = [];
  for(let i=0;i<all.length;i++) if(all[i].offsetParent !== null) out.push(all[i]);
  return out;
}
document.addEventListener("keydown", e => {
  const k = e.key || "", kc = e.keyCode;
  const dv = (k==="ArrowUp"||kc===38) ? [0,-1] : (k==="ArrowDown"||kc===40) ? [0,1] : (k==="ArrowLeft"||kc===37) ? [-1,0] : (k==="ArrowRight"||kc===39) ? [1,0] : null;
  if(!dv) return;
  e.preventDefault();
  const cur = document.activeElement, list = focusables();
  if(!cur || cur===document.body){ if(list[0]) list[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bs = Infinity;
  for(const el of list){
    if(el===cur) continue;
    const b = el.getBoundingClientRect(), dx = b.left + b.width/2 - cx, dy = b.top + b.height/2 - cy;
    const along = dv[0] ? dx*dv[0] : dy*dv[1];
    if(along <= 4) continue;
    const s = along + (dv[0] ? Math.abs(dy) : Math.abs(dx)) * 2.5;
    if(s < bs){ bs = s; best = el; }
  }
  if(best){
    best.focus();
    if(best.parentNode === $("tabs")){ const t = $("tabs"); const L = best.offsetLeft - t.offsetLeft; if(L < t.scrollLeft + 20) t.scrollLeft = L - 40; else if(L + best.offsetWidth > t.scrollLeft + t.clientWidth - 20) t.scrollLeft = L + best.offsetWidth - t.clientWidth + 40; }
    else if(best.scrollIntoView) best.scrollIntoView(false);
  }
});

function tick(){ $("clock").textContent = hhmm(new Date()); }
tick(); setInterval(tick, 15000);
drawTabs();
refresh();
setInterval(refresh, 5*60e3);   // tự cập nhật 5 phút một lần
setTimeout(() => { const b = $("tabs").querySelector(".on"); if(b) b.focus(); }, 150);
</script>
