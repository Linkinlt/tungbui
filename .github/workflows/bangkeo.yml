name: Build APK
on:
  push:
    paths: ['bangkeo/**', '.github/workflows/bangkeo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon
        working-directory: bangkeo
      - run: cp bangkeo/app/build/outputs/apk/release/app-release.apk BangKeo.apk
      - uses: actions/upload-artifact@v4
        with: { name: BangKeo-apk, path: BangKeo.apk }
      - name: Save APK into repo
        run: |
          mkdir -p apk && cp BangKeo.apk apk/BangKeo.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/BangKeo.apk
          git commit -m "Build BangKeo.apk [skip ci]" || echo "no change"
          git push
